<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1f1f" />

    <!-- Icons. SVG first: modern browsers prefer it and it stays crisp at any
         size; the .ico is the legacy fallback. All are the glyph in absolute
         #000 — they were previously the palette's old olive #3d4335. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="canonical" href="https://aressecurity.co/" />

    <title>Security Guard Services in Colorado Springs | Ares Security</title>
    <meta
      name="description"
      content="Woman-owned WOSB and WBENC security firm in Colorado Springs. Armed and unarmed officers, patrol, and access control across Denver and Pueblo. GSA MAS holder."
    />

    <!-- OpenGraph. These live in the static head, so link previews work even
         though the body is client-rendered — social crawlers do not run JS. -->

    <meta property="og:site_name" content="Ares Security LLC" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Security Guard Services in Colorado Springs | Ares Security" />

      property="og:description"
      content="Woman-owned WOSB and WBENC security firm in Colorado Springs. Armed and unarmed officers, patrol, and access control across Denver and Pueblo. GSA MAS holder."
    />
    <meta property="og:url" content="https://aressecurity.co/" />
    <meta property="og:image" content="https://aressecurity.co/og-ares-security.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ares Security officers on post, with GSA Contract Holder and Women Owned marks"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Security Guard Services in Colorado Springs | Ares Security" />
    <meta
      name="twitter:description"
      content="Woman-owned WOSB and WBENC security firm in Colorado Springs. Armed and unarmed officers, patrol, and access control across Denver and Pueblo. GSA MAS holder."
    />
    <meta name="twitter:image" content="https://aressecurity.co/og-ares-security.jpg" />
