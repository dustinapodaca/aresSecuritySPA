<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1f1f1f" />

    <!--
      Gate for the scroll animations in index.scss. Everything under
      [data-reveal] / .hero-rise / .cert-cascade starts at opacity 0, and only
      this class turns that on.

      Two reasons it is set here rather than from React:

        1. Without JavaScript the class never appears, so the prerendered
           markup renders fully visible. The build is prerendered precisely so
           non-JS crawlers can read it, and serving them opacity:0 text they
           cannot reveal is indistinguishable from hidden-text cloaking.
        2. Setting it from React would mean a painted frame with the content
           visible, then a jump to hidden. Synchronous, there is no such frame.

      It MUST stay in <head>, above the stylesheet CRA injects at the end of
      head. A classic inline script has to wait for any pending stylesheet
      before it runs, and the parser waits with it — this same tag in <body>
      blocked the entire page from being parsed for ~360ms, so the hero
      appeared all at once and only then began animating. Up here nothing is
      pending yet and it executes immediately.

      scripts/prerender.js strips this class back out of the saved HTML.
    -->
    <script>document.documentElement.classList.add('js-reveal');</script>

    <!-- Icons. All are the grey Ares glyph on a solid black rounded-square
         plate. The original set was the bare glyph on transparent and was not
         square, so Google would not use it: it requires a square icon of at
         least 48x48, and an opaque plate is what keeps the mark visible in
         both its light and dark result pages.

         Three deliberate details:
           - Rasterised by supersampling (rendered at 4x, downscaled through
             canvas with high-quality smoothing). Rendering straight to 48 or
             16px made Chrome resolve the glyph's fine inner gap at that
             resolution, which looked chewed up.
           - The glyph sits slightly up and left of centre. Surfaces that crop
             an icon to a circle take the corners off, and this mark's weight
             is low-right, so that was the corner being clipped.
           - apple-touch-icon is full-bleed, not rounded: iOS applies its own
             mask, and rounding it here as well double-rounds the corners.
         The -v2 filenames are deliberate. Google caches favicons by URL and is
         slow to refetch an unchanged path, so new paths get it to look again.
         /favicon.ico stays at the root as the conventional fallback and has
         been rebuilt with the same artwork at 16/32/48. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon-v2.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-v2-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-v2-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon-v2.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="canonical" href="https://aressecurity.co/" />

    <title>Security Guards in Colorado Springs, Denver & Pueblo | Ares</title>
    <meta
      name="description"
      content="Woman-owned (WOSB, WBENC) security company serving Colorado Springs, Denver and Pueblo: armed and unarmed officers, patrol and access control. GSA MAS holder."
    />

    <!-- OpenGraph. These live in the static head, so link previews work even
         though the body is client-rendered — social crawlers do not run JS. -->

    />

    <meta property="og:image" content="https://aressecurity.co/og-ares-security.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Ares Security officers on post, with GSA Contract Holder and Women Owned marks"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Security Guards in Colorado Springs, Denver & Pueblo | Ares" />
    <meta
      name="twitter:description"
      content="Woman-owned (WOSB, WBENC) security company serving Colorado Springs, Denver and Pueblo: armed and unarmed officers, patrol and access control. GSA MAS holder."
    />
    <meta name="twitter:image" content="https://aressecurity.co/og-ares-security.jpg" />

    />
